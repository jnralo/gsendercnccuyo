name: CI (Windows)

# Compila solo el instalador de Windows (x64).
# Los trabajos de Linux, macOS y Raspberry Pi se guardaron en
# .github/disabled-workflows/CI-multiplataforma.yml para reactivarlos mas adelante.

on:
  push:
    branches:
      - master
      - windows-base
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Prepare VC++ Runtime
        run: choco install -y vcredist2017
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup and build
        uses: ./.github/actions/setup-build
      - name: Build Windows binaries
        run: yarn run build:windows
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p releases/windows
          ls -al output
          cp -af output/*.exe releases/windows/
          ls -al releases/windows
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows_installer
          path: releases/windows/*.exe
          compression-level: 0 # el .exe ya esta comprimido
          retention-days: 14
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/windows/*.exe
          prerelease: true
          draft: true
